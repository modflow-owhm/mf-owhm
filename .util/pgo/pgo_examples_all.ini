; build_pgo.py sample: train the profile with the whole example suite (the
; models of examples/bash_example_run/2_RunAllTests_*.sh, about 20 minutes).
; The extended mf-owhm-v1 tests and the GMG example (needs gmg = yes) are not
; included. Copy or edit, then: python3 .util/pgo/build_pgo.py .util/pgo/pgo_examples_all.ini

[build]
name     = mf-owhm-pgo
gmg      = no
engine   = auto
profdir  = obj/pgo
keep_gen = no
log      = obj/pgo/build_pgo.log

[make]
args     = F90=ifx CC=icx
oneapi   = auto

[vs]
devenv   = auto
msbuild  = auto
oneapi   = auto

[train]
; run_dir: working folder per model, one line per model (NAME_DIR = folder
; of the name file, the default for every model without a line); see pgo.ini
run_dir =
models =
    ; MF-OWHM (FMP, SFR, MNW2, GHB, LPF, PCG)
    examples/mf-owhm/0_Base/OWHM_Examples.nam
    examples/mf-owhm/1_GHB/OWHM_Examples.nam
    examples/mf-owhm/2_FMP/OWHM_Examples.nam
    examples/mf-owhm/3_SFR/OWHM_Examples.nam
    ; MODFLOW-2005
    examples/mf-2005/bcf2ss.nam
    examples/mf-2005/etsdrt.nam
    examples/mf-2005/fhb.nam
    examples/mf-2005/ibs2k.nam
    examples/mf-2005/l1a2k.nam
    examples/mf-2005/l1b2k.nam
    examples/mf-2005/l1b2k_bath.nam
    examples/mf-2005/mnw1.nam
    examples/mf-2005/MNW2-Fig28.nam
    examples/mf-2005/restest.nam
    examples/mf-2005/str.nam
    examples/mf-2005/swtex4.nam
    examples/mf-2005/tc2hufv4.nam
    examples/mf-2005/test1ss.nam
    examples/mf-2005/test1tr.nam
    examples/mf-2005/testsfr2.nam
    examples/mf-2005/testsfr2_tab.nam
    examples/mf-2005/tr2k_s3.nam
    examples/mf-2005/twri.nam
    examples/mf-2005/twrihfb.nam
    examples/mf-2005/twrip.nam
    examples/mf-2005/UZFtest2.nam
    ; MODFLOW-2005 models solved with NWT
    examples/mf-2005-nwt/etsdrt_nwt.nam
    examples/mf-2005-nwt/swtex4_nwt.nam
    examples/mf-2005-nwt/test1ss_nwt.nam
    examples/mf-2005-nwt/test1tr_nwt.nam
    examples/mf-2005-nwt/testsfr2_nwt.nam
    examples/mf-2005-nwt/testsfr2_tab_nwt.nam
    examples/mf-2005-nwt/twrip_nwt.nam
