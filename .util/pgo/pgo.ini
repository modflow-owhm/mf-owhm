; Settings for .util/pgo/build_pgo.py, the one-step profile-guided build
; (ifx only): instrumented build, training runs, profile merge, final build.
;
;   python3 .util/pgo/build_pgo.py            Linux, macOS, msys2 (GNU make)
;   py .util\pgo\build_pgo.py                 Windows (Visual Studio solution)
;
; Paths are relative to the repository root. The command line can override
; name (--name), gmg (--gmg), engine (--engine) and profdir (--profdir);
; --dry-run prints the commands without running anything.
; See doc/BUILD.md, section "Fast and profile-guided builds".

[build]
name     = mf-owhm-pgo  ; final binary bin/<name>.exe (Windows) or bin/<name>.nix
gmg      = no           ; yes: GMG solver variant (make USEGMG=YES / OneWater_GMG_Project.sln); name defaults to mf-owhm-gmg
engine   = auto         ; make | vs | auto (make on Linux and macOS, vs on Windows)
profdir  = obj/pgo      ; profile directory of the make engine (the Visual Studio projects always use obj\pgo)
keep_gen = no           ; yes: keep the instrumented binary bin/<name>-pgo-gen
log      = obj/pgo/build_pgo.log

[make]                  ; engine make: make compile CONFIG=fast-pgo-gen, then CONFIG=fast-pgo (serial: the makefile has no module dependencies)
args     = F90=ifx CC=icx   ; extra make variables, for example STATIC=NO
oneapi   = auto         ; setvars.sh sourced before make when ifx is not on PATH (auto: $ONEAPI_ROOT, /opt/intel/oneapi, ~/intel/oneapi, ~/.intel/oneapi)

[vs]                    ; engine vs: devenv.com <solution> /Rebuild Fast_PGO_Gen|x64, then Fast_PGO|x64
devenv   = auto         ; path of devenv.com (auto: newest Visual Studio found by vswhere)
msbuild  = auto         ; path of MSBuild.exe, used for GMG.vcxproj when gmg = yes
oneapi   = auto         ; oneAPI compiler folder with bin\compiler\llvm-profdata.exe (auto: ...\Intel\oneAPI\compiler\latest)

[train]
; Training models, one per line: the name file (relative to the repository
; root or absolute), followed by any extra command-line arguments. A few
; stress periods of a model that resembles the ones the binary is built for
; make the best profile; the repository examples are a quick general-purpose
; set (see pgo_examples_all.ini and pgo_examples_by_package.ini).
;
; run_dir gives the working folder of each run, one line per model in the
; same order as models. NAME_DIR is the folder of the name file, which is
; also used for every model that has no run_dir line, so run_dir may be
; left empty or stop after the last model that needs a different folder.
models =
    examples/mf-owhm/0_Base/OWHM_Examples.nam
    examples/mf-owhm/1_GHB/OWHM_Examples.nam
    examples/mf-owhm/2_FMP/OWHM_Examples.nam
    examples/mf-owhm/3_SFR/OWHM_Examples.nam
run_dir =
    NAME_DIR
    examples/mf-owhm/1_GHB
    NAME_DIR
    NAME_DIR
