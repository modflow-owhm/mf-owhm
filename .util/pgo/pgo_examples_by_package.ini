; build_pgo.py sample: one training model per major package, a short
; general-purpose profile (a few minutes). Copy or edit, then:
;   python3 .util/pgo/build_pgo.py .util/pgo/pgo_examples_by_package.ini

[build]
name     = mf-owhm
gmg      = no
engine   = auto
profdir  = obj/pgo
keep_gen = no
log      = obj/pgo/build_pgo.log

[make]
args     = F90=ifx CC=icx
oneapi   = auto

[vs]
devenv   = auto
msbuild  = auto
oneapi   = auto

[train]
; run_dir: working folder per model, one line per model (NAME_DIR = folder
; of the name file, the default for every model without a line); see pgo.ini
run_dir =
models =
    examples/mf-nwt/Pr3_MFNWT_higher.nam            ; NWT and UPW
    examples/mf-owhm/2_FMP/OWHM_Examples.nam        ; FMP (with MNW2, GHB, LPF, PCG)
    examples/mf-owhm/3_SFR/OWHM_Examples.nam        ; SFR
    examples/mf-2005/MNW2-Fig28.nam                 ; MNW2
    examples/mf-owhm/0_Base/OWHM_Examples.nam       ; LPF and PCG
    ; other packages, add as needed:
    ; examples/mf-2005/UZFtest2.nam                 ; UZF
    ; examples/mf-2005/swtex4.nam                   ; SWT (subsidence)
    ; examples/mf-swr/SWRSample01.nam               ; SWR1
    ; examples/mf-swi/swi2ex4_2d.nam                ; SWI2
    ; examples/mf-cfp/cfp_mode1_example/cfp_mode1_example.nam   ; CFP
    ; examples/mf-rip/RIP-ET_EX1.nam                ; RIP-ET
